# Drop-in for docker.service: order Docker's startup after Tailscale.
#
# On boot, dockerd's container-restore step tries each restart-policy
# container exactly once. Anything that binds a host port to a Tailscale
# address can race tailscaled's own boot-time reconnect (key exchange,
# address reacquisition) and fail with "cannot assign requested address" -
# which then leaves the container Exited with no further retries. See
# incidents/2026-08-09-lldap-authelia-outage.md.
#
# This doesn't fully close the race (tailscaled "started" isn't the same
# instant as "has its tailnet address"), it just narrows the window. The
# actual fix for lldap was to stop binding to the Tailscale IP directly
# (see apps/lldap/docker-compose.yml + `tailscale serve`); this is
# defense-in-depth for anything else that might do the same in future.
#
# Install with:
#   sudo mkdir -p /etc/systemd/system/docker.service.d
#   sudo cp systemd/docker-after-tailscaled.conf /etc/systemd/system/docker.service.d/override.conf
#   sudo systemctl daemon-reload
#
# No restart of docker.service is required for this to take effect - it
# only affects service *ordering* on the next boot.

[Unit]
After=tailscaled.service
Wants=tailscaled.service
