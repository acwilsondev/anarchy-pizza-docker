services:

  vikunja:
    image: vikunja/vikunja
    container_name: vikunja
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ}
    volumes:
      - ${STORAGE_ROOT}/silver/vikunja/files:/app/vikunja/files
    depends_on:
      vikunja-postgresql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - anarchy-pizza

  vikunja-postgresql:
    image: postgres:18
    container_name: vikunja-postgresql
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ${STORAGE_ROOT}/silver/vikunja-postgresql:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - anarchy-pizza

networks:
  anarchy-pizza:
    name: anarchy-pizza
    external: true
