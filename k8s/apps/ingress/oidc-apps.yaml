apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vikunja
  namespace: vikunja
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`vikunja.anarchy.pizza`)
      kind: Rule
      services:
        - name: vikunja
          port: 3456
      middlewares:
        - name: crowdsec-bouncer
          namespace: traefik
  tls: {}
---
