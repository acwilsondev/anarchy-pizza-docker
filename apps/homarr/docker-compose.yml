services:

  homarr:
    image: ghcr.io/homarr-labs/homarr:v1.32.0
    container_name: homarr
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - SECRET_ENCRYPTION_KEY=${SECRET_ENCRYPTION_KEY}
      # Required for OIDC - otherwise Homarr sends localhost as the
      # callback origin instead of the real domain.
      - BASE_URL=https://homarr.${DOMAIN}
      - NEXTAUTH_URL=https://homarr.${DOMAIN}
      # Authelia OIDC only - no local credentials login.
      - AUTH_PROVIDERS=oidc
      - AUTH_OIDC_AUTO_LOGIN=true
      - AUTH_OIDC_ISSUER=${AUTH_OIDC_ISSUER}
      - AUTH_OIDC_CLIENT_ID=${AUTH_OIDC_CLIENT_ID}
      - AUTH_OIDC_CLIENT_SECRET=${AUTH_OIDC_CLIENT_SECRET}
      - AUTH_OIDC_CLIENT_NAME=Authelia
      - AUTH_OIDC_SCOPE_OVERWRITE=openid email profile groups
      - AUTH_OIDC_GROUPS_ATTRIBUTE=groups
      # Authelia-specific: without this Homarr doesn't retrieve claims
      # correctly (per Authelia's own Homarr integration notes).
      - AUTH_OIDC_FORCE_USERINFO=true
      - AUTH_LOGOUT_REDIRECT_URL=https://auth.${DOMAIN}/logout
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${STORAGE_ROOT}/bronze/homarr:/appdata
    labels:
      - traefik.enable=true
      - traefik.http.routers.homarr.rule=Host(`homarr.${DOMAIN}`)
      - traefik.http.routers.homarr.entrypoints=web
      - traefik.http.services.homarr.loadbalancer.server.port=7575
      - traefik.http.routers.homarr-secure.rule=Host(`homarr.${DOMAIN}`)
      - traefik.http.routers.homarr-secure.entrypoints=websecure
      - traefik.http.routers.homarr-secure.tls.certresolver=le
      - traefik.http.routers.homarr-secure.service=homarr
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - anarchy-pizza

networks:
  anarchy-pizza:
    name: anarchy-pizza
    external: true
