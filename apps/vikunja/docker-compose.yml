services:

  vikunja:
    image: vikunja/vikunja:2.5.0
    container_name: vikunja
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ}
    volumes:
      - ${STORAGE_ROOT}/silver/vikunja/files:/app/vikunja/files
    depends_on:
      vikunja-postgresql:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.vikunja.rule=Host(`vikunja.${DOMAIN}`)
      - traefik.http.routers.vikunja.entrypoints=web
      - traefik.http.services.vikunja.loadbalancer.server.port=3456
      - traefik.http.routers.vikunja-secure.rule=Host(`vikunja.${DOMAIN}`)
      - traefik.http.routers.vikunja-secure.entrypoints=websecure
      - traefik.http.routers.vikunja-secure.tls.certresolver=le
      - traefik.http.routers.vikunja-secure.service=vikunja
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - homelab

  vikunja-postgresql:
    image: postgres:18
    container_name: vikunja-postgresql
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ${STORAGE_ROOT}/silver/vikunja-postgresql:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - homelab

networks:
  homelab:
    name: homelab
    external: true
