services:

  traefik:
    image: traefik:latest
    container_name: traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=homelab
      # Internal NPM-facing entrypoint - unchanged, still used until NPM
      # is actually dropped (see migration_plan.md's NPM cutover plan).
      - --entrypoints.web.address=:8080
      - --entrypoints.web.forwardedHeaders.trustedIPs=172.25.0.0/16
      # Public entrypoints - Traefik owns 80/443 directly now, NPM is
      # dropped (see migration_plan.md's NPM cutover plan).
      - --entrypoints.webinsecure.address=:80
      - --entrypoints.webinsecure.http.redirections.entrypoint.to=websecure
      - --entrypoints.webinsecure.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=acwilsoncs@gmail.com
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=webinsecure
      - --log.level=INFO
      # Access log to stdout (JSON) - crowdsec reads it via the docker
      # socket, no file mount needed. See apps/crowdsec/SETUP.md.
      - --accesslog=true
      - --accesslog.format=json
      # CrowdSec bouncer plugin - the middleware itself (crowdsec@docker) is
      # defined via labels on the crowdsec container, same pattern as
      # authelia@docker on the authelia container. Applying it at the
      # entrypoint level means every router gets it automatically, before
      # any router's own middleware chain (e.g. Authelia forward-auth).
      - --experimental.plugins.bouncer.modulename=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      - --experimental.plugins.bouncer.version=v1.7.1
      - --entrypoints.webinsecure.http.middlewares=crowdsec@docker
      - --entrypoints.websecure.http.middlewares=crowdsec@docker
    environment:
      - TZ=${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${STORAGE_ROOT}/silver/traefik/acme.json:/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - homelab

networks:
  homelab:
    name: homelab
    external: true
