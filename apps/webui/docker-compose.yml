services:

  open-webui:
    image: ghcr.io/open-webui/open-webui:ollama
    container_name: open-webui
    restart: unless-stopped
    environment:
      # Trusts Authelia's forward-auth headers - auto-registers/logs in on
      # email match, no pre-existing account needed (unlike Calibre-web).
      - WEBUI_AUTH_TRUSTED_EMAIL_HEADER=Remote-Email
      - WEBUI_AUTH_TRUSTED_NAME_HEADER=Remote-Name
      # Ollama defaults to 127.0.0.1 only, unreachable from other
      # containers (e.g. n8n) even on the shared homelab network.
      # Binding 0.0.0.0 is still internal-only - no host port is published.
      - OLLAMA_HOST=0.0.0.0:11434
      # Web search via apps/searxng, called container-to-container (never
      # through Traefik/Authelia - see that instance's limiter.toml for
      # why the internal subnet is allowlisted there).
      - ENABLE_WEB_SEARCH=true
      - WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://searxng:8080/search?q=<query>
    volumes:
      - ${STORAGE_ROOT}/bronze/ollama:/root/.ollama
      - ${STORAGE_ROOT}/silver/open-webui:/app/backend/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    labels:
      - traefik.enable=true
      - traefik.http.routers.openwebui.rule=Host(`llm.${DOMAIN}`)
      - traefik.http.routers.openwebui.entrypoints=web
      - traefik.http.routers.openwebui.middlewares=authelia@docker
      - traefik.http.services.openwebui.loadbalancer.server.port=8080
      - traefik.http.routers.openwebui-secure.rule=Host(`llm.${DOMAIN}`)
      - traefik.http.routers.openwebui-secure.entrypoints=websecure
      - traefik.http.routers.openwebui-secure.tls.certresolver=le
      - traefik.http.routers.openwebui-secure.service=openwebui
      - traefik.http.routers.openwebui-secure.middlewares=authelia@docker
    networks:
      - homelab

networks:
  homelab:
    name: homelab
    external: true
