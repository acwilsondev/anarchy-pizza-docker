controllers:
  vikunja:
    containers:
      main:
        image:
          repository: vikunja/vikunja
          tag: latest
        env:
          VIKUNJA_SERVICE_PUBLICURL: "https://vikunja.anarchy.pizza/"
          VIKUNJA_SERVICE_ENABLEREGISTRATION: "false"
          VIKUNJA_DATABASE_TYPE: postgres
          VIKUNJA_DATABASE_HOST: vikunja-postgresql
          VIKUNJA_AUTH_OPENID_ENABLED: "true"
          VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHELIA_NAME: Authelia
          VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHELIA_AUTHURL: "https://auth.anarchy.pizza"
          VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHELIA_CLIENTID: vikunja
          VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHELIA_SCOPE: "openid profile email"
          VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHELIA_EMAILFALLBACK: "true"
        envFrom:
          - secretRef:
              name: vikunja-secrets
          - secretRef:
              name: vikunja-oidc-secrets
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 512Mi

  postgresql:
    containers:
      main:
        image:
          repository: postgres
          tag: "18"
        envFrom:
          - secretRef:
              name: vikunja-postgres-secrets
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi

service:
  vikunja:
    controller: vikunja
    ports:
      http:
        port: 3456
  postgresql:
    controller: postgresql
    ports:
      postgres:
        port: 5432

persistence:
  files:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 2Gi
    advancedMounts:
      vikunja:
        main:
          - path: /app/vikunja/files
  postgres-data:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 2Gi
    advancedMounts:
      postgresql:
        main:
          - path: /var/lib/postgresql
