services:
  minio:
    image: quay.io/minio/minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    ports:
      # S3 API only - scripts/rclone/etc. use access keys, not browser
      # auth, so this stays a direct port, not behind Authelia/Traefik.
      - "9008:9000"
      # Console UI is NOT published here - it's Traefik/Authelia-routed
      # instead (see labels below), same as every other app in this repo.
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_IDENTITY_OPENID_CONFIG_URL: https://auth.${DOMAIN}/.well-known/openid-configuration
      MINIO_IDENTITY_OPENID_CLIENT_ID: minio
      MINIO_IDENTITY_OPENID_CLIENT_SECRET: ${MINIO_IDENTITY_OPENID_CLIENT_SECRET}
      MINIO_IDENTITY_OPENID_SCOPES: "openid,profile,email,groups"
      MINIO_IDENTITY_OPENID_REDIRECT_URI: https://minio.${DOMAIN}/oauth_callback
      MINIO_IDENTITY_OPENID_REDIRECT_URI_DYNAMIC: "off"
      MINIO_IDENTITY_OPENID_DISPLAY_NAME: Authelia
      # Maps the OIDC "groups" claim to a MinIO policy of the same name -
      # the "admins" policy (cloned from consoleAdmin) was created via
      # `mc admin policy create` to match LLDAP's "admins" group. Any
      # LLDAP group without a matching MinIO policy gets no access.
      MINIO_IDENTITY_OPENID_CLAIM_NAME: groups
      MINIO_IDENTITY_OPENID_CLAIM_USERINFO: "on"
    volumes:
      - ${STORAGE_ROOT}/gold/minio:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.minio-console.rule=Host(`minio.${DOMAIN}`)
      - traefik.http.routers.minio-console.entrypoints=web
      - traefik.http.services.minio-console.loadbalancer.server.port=9001
    networks:
      - homelab
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  homelab:
    external: true
