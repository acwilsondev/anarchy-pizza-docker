services:

  freshrss:
    image: freshrss/freshrss:1.29.1
    container_name: freshrss
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - CRON_MIN=3,33
      # Homelab subnet - lets FreshRSS trust the Remote-User header
      # forwarded by Authelia via Traefik (same subnet already trusted by
      # Traefik's forwardedHeaders and Authelia's session cookie chain).
      - TRUSTED_PROXY=172.25.0.0/16
      - FRESHRSS_INSTALL=--api-enabled --auth-type http_auth --base-url https://news.${DOMAIN} --db-type sqlite --default-user ${FRESHRSS_USERNAME} --language en --title FreshRSS
      - FRESHRSS_USER=--user ${FRESHRSS_USERNAME} --password ${FRESHRSS_ADMIN_PASSWORD} --email ${FRESHRSS_ADMIN_EMAIL} --api-password ${FRESHRSS_ADMIN_PASSWORD}
    volumes:
      - ${STORAGE_ROOT}/silver/freshrss/data:/var/www/FreshRSS/data
      - ${STORAGE_ROOT}/silver/freshrss/extensions:/var/www/FreshRSS/extensions
    labels:
      - traefik.enable=true
      - traefik.http.routers.freshrss.rule=Host(`news.${DOMAIN}`)
      - traefik.http.routers.freshrss.entrypoints=web
      - traefik.http.routers.freshrss.middlewares=authelia@docker
      - traefik.http.services.freshrss.loadbalancer.server.port=80
      - traefik.http.routers.freshrss-secure.rule=Host(`news.${DOMAIN}`)
      - traefik.http.routers.freshrss-secure.entrypoints=websecure
      - traefik.http.routers.freshrss-secure.tls.certresolver=le
      - traefik.http.routers.freshrss-secure.service=freshrss
      - traefik.http.routers.freshrss-secure.middlewares=authelia@docker
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - homelab

networks:
  homelab:
    name: homelab
    external: true
