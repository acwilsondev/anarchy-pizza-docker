services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    restart: unless-stopped
    volumes:
      - ${STORAGE_ROOT}/bronze/uptime-kuma:/app/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.uptimekuma.rule=Host(`uptime.${DOMAIN}`)
      - traefik.http.routers.uptimekuma.entrypoints=web
      - traefik.http.routers.uptimekuma.middlewares=authelia@docker
      - traefik.http.services.uptimekuma.loadbalancer.server.port=3001
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      # <Host Port>:<Container Port>
      - "3001:3001"
    networks:
      - anarchy-pizza

networks:
  anarchy-pizza:
    name: anarchy-pizza
    external: true

