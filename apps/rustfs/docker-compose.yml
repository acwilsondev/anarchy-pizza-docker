services:

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - RUSTFS_ROOT_USER=${RUSTFS_ROOT_USER}
      - RUSTFS_ROOT_PASSWORD=${RUSTFS_ROOT_PASSWORD}
      - RUSTFS_ADDRESS=:9000
      - RUSTFS_CONSOLE_ADDRESS=:9001
      - RUSTFS_CONSOLE_ENABLE=true
      # OIDC via Authelia - console only, same reasoning as MinIO: the S3
      # API stays on access-key auth for scripts/rclone, not OIDC.
      - RUSTFS_IDENTITY_OPENID_ENABLE=true
      - RUSTFS_IDENTITY_OPENID_CONFIG_URL=https://auth.${DOMAIN}/.well-known/openid-configuration
      - RUSTFS_IDENTITY_OPENID_CLIENT_ID=rustfs
      - RUSTFS_IDENTITY_OPENID_CLIENT_SECRET=${RUSTFS_OIDC_CLIENT_SECRET}
      - RUSTFS_IDENTITY_OPENID_SCOPES=openid,profile,email,groups
      # Maps the OIDC groups claim to a RustFS policy of the same name -
      # same pattern as MinIO/Homarr: an "admins" policy needs to exist
      # to match LLDAP's "admins" group, no auto-provisioning.
      - RUSTFS_IDENTITY_OPENID_GROUPS_CLAIM=groups
      - RUSTFS_IDENTITY_OPENID_DISPLAY_NAME=Authelia
    volumes:
      - ${STORAGE_ROOT}/gold/rustfs:/data
      # /logs must be bind-mounted and pre-chowned to 10001:10001 (the
      # image's rustfs user) - it's not chowned correctly on the image's
      # own writable layer otherwise (known upstream bug, "Permission
      # denied (os error 13)" on the rolling file appender at startup).
      - ${STORAGE_ROOT}/gold/rustfs-logs:/logs
    ports:
      # S3 API only - scripts/rclone/etc. use access keys, not browser
      # auth, so this stays a direct port, not behind Authelia/Traefik.
      # Console is Traefik-routed instead (see labels below). 9008 is
      # MinIO's old port, reused here now that MinIO is fully retired.
      - "9008:9000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.rustfs-console.rule=Host(`rustfs.${DOMAIN}`)
      - traefik.http.routers.rustfs-console.entrypoints=web
      - traefik.http.services.rustfs-console.loadbalancer.server.port=9001
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - anarchy-pizza

networks:
  anarchy-pizza:
    name: anarchy-pizza
    external: true
