services:

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - SEARXNG_BASE_URL=https://search.${DOMAIN}/
      # secret_key in settings.yml is overwritten by this at runtime -
      # generate with `openssl rand -hex 32`, see .env.example.
      - SEARXNG_SECRET=${SEARXNG_SECRET}
      - SEARXNG_VALKEY_URL=redis://searxng-valkey:6379/0
      - SEARXNG_LIMITER=true
    volumes:
      - ${STORAGE_ROOT}/silver/searxng/config:/etc/searxng
      - ${STORAGE_ROOT}/bronze/searxng/cache:/var/cache/searxng
    depends_on:
      searxng-valkey:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.searxng.rule=Host(`search.${DOMAIN}`)
      - traefik.http.routers.searxng.entrypoints=web
      - traefik.http.routers.searxng.middlewares=authelia@docker
      - traefik.http.services.searxng.loadbalancer.server.port=8080
      - traefik.http.routers.searxng-secure.rule=Host(`search.${DOMAIN}`)
      - traefik.http.routers.searxng-secure.entrypoints=websecure
      - traefik.http.routers.searxng-secure.tls.certresolver=le
      - traefik.http.routers.searxng-secure.service=searxng
      - traefik.http.routers.searxng-secure.middlewares=authelia@docker
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - anarchy-pizza

  searxng-valkey:
    image: valkey/valkey:9-alpine
    container_name: searxng-valkey
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    volumes:
      - ${STORAGE_ROOT}/bronze/searxng-valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - anarchy-pizza

networks:
  anarchy-pizza:
    name: anarchy-pizza
    external: true
