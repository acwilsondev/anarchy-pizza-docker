services:

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - COLLECTIONS=crowdsecurity/traefik crowdsecurity/http-cve Dominic-Wagner/vaultwarden
    volumes:
      - ${STORAGE_ROOT}/silver/crowdsec/config:/etc/crowdsec
      - ${STORAGE_ROOT}/silver/crowdsec/data:/var/lib/crowdsec/data
      - ./acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - ./parsers/local-traefik-program-fix.yaml:/etc/crowdsec/parsers/s00-raw/local-traefik-program-fix.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # No router - reached internally as crowdsec:8080 (LAPI) by the Traefik
    # bouncer plugin, never exposed publicly. traefik.enable is only here so
    # the docker provider picks up the middleware labels below, same trick
    # apps/authelia uses to define authelia@docker without routing to itself.
    labels:
      - traefik.enable=true
      # Never routed to - no router rule below - but the docker provider
      # still needs a resolvable service port for any of this container's
      # labels to load at all, middleware included. Without this line,
      # Traefik fails with "port is missing" and crowdsec@docker silently
      # never registers (every router then errors "middleware does not
      # exist"), even though the middleware label itself is otherwise fine.
      - traefik.http.services.crowdsec.loadbalancer.server.port=8080
      - traefik.http.middlewares.crowdsec.plugin.bouncer.enabled=true
      - traefik.http.middlewares.crowdsec.plugin.bouncer.crowdseclapikey=${CROWDSEC_BOUNCER_KEY}
      - traefik.http.middlewares.crowdsec.plugin.bouncer.crowdseclapihost=crowdsec:8080
      # live, not stream: stream mode blocks *all* traffic until its first
      # decision sync with crowdsec completes, which raced a Traefik restart
      # in practice and 403'd real traffic for ~45s (see incidents/ if this
      # happens again). live queries crowdsec per-request instead - a few ms
      # of added latency on an internal docker network, in exchange for no
      # blackout window on every future restart.
      - traefik.http.middlewares.crowdsec.plugin.bouncer.crowdsecmode=live
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - anarchy-pizza

networks:
  anarchy-pizza:
    name: anarchy-pizza
    external: true
