theme: light

server:
  address: 'tcp://:9091'

log:
  level: info

totp:
  issuer: anarchy.pizza

authentication_backend:
  ldap:
    implementation: 'lldap'
    address: 'ldap://lldap:3890'
    base_dn: 'dc=anarchy,dc=pizza'
    user: 'uid=authelia,ou=people,dc=anarchy,dc=pizza'

# identity_providers.oidc lives in identity_providers.yml (host-only,
# not in git - see apps/authelia/docker-compose.yml's --config flag and
# migration_plan.md's "Identity backend: LLDAP" / OIDC sections). It's a
# separate file rather than templated secrets here because it holds a raw
# RSA private key, which has no _FILE/templating equivalent in this
# Authelia version that behaved reliably - a second --config file, deep
# merged, was simpler and more robust.

access_control:
  default_policy: deny
  rules:
    - domain: "dozzle.anarchy.pizza"
      subject: "group:users"
      policy: deny
    - domain: "uptime.anarchy.pizza"
      subject: "group:users"
      policy: deny
    - domain: "friendica.anarchy.pizza"
      subject: "group:users"
      policy: deny
    - domain: "*.anarchy.pizza"
      subject: "group:admins"
      policy: one_factor
    - domain: "*.anarchy.pizza"
      subject: "group:users"
      policy: one_factor

session:
  cookies:
    - domain: anarchy.pizza
      authelia_url: "https://auth.anarchy.pizza"
      expiration: 1h
      inactivity: 5m

regulation:
  max_retries: 3
  find_time: 2m
  ban_time: 5m

storage:
  local:
    path: /config/db.sqlite3

notifier:
  filesystem:
    filename: /config/notification.txt
