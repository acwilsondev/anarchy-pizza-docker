services:
  
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      WEBSOCKET_ENABLED: "true"
      DOMAIN: ${VAULTWARDEN_DOMAIN}
      TZ: ${TZ}
      # Both required for crowdsec's Dominic-Wagner/vaultwarden collection to
      # see failed-login attempts with a usable client IP and a UTC-anchored
      # timestamp - see apps/crowdsec/SETUP.md.
      IP_HEADER: "X-Forwarded-For"
      LOG_TIMESTAMP_FORMAT: "%Y-%m-%d %H:%M:%S.%3f%z"
    volumes:
      - ${STORAGE_ROOT}/gold/vault:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/alive"]
      interval: 1m
      timeout: 10s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.http.routers.vaultwarden.rule=Host(`vault.${DOMAIN}`)
      - traefik.http.routers.vaultwarden.entrypoints=websecure
      - traefik.http.routers.vaultwarden.tls.certresolver=le
      - traefik.http.services.vaultwarden.loadbalancer.server.port=80
    networks:
      - anarchy-pizza

networks:
  anarchy-pizza:
    name: anarchy-pizza
    external: true