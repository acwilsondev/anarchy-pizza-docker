services:

  synapse:
    image: matrixdotorg/synapse:latest
    container_name: synapse
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Only consulted for the one-off `generate` run - see SETUP.md.
      - SYNAPSE_SERVER_NAME=matrix.${DOMAIN}
      - SYNAPSE_REPORT_STATS=no
    volumes:
      - ${STORAGE_ROOT}/gold/synapse:/data
    depends_on:
      synapse-postgresql:
        condition: service_healthy
    healthcheck:
      # No curl in this image - python3 is guaranteed present since it's
      # Synapse's own runtime.
      test:
        - CMD-SHELL
        - "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8008/health', timeout=5)\""
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.matrix.rule=Host(`matrix.${DOMAIN}`)
      - traefik.http.routers.matrix.entrypoints=websecure
      - traefik.http.routers.matrix.tls.certresolver=le
      - traefik.http.services.matrix.loadbalancer.server.port=8008
      # No federation router/port anywhere in this file, intentionally -
      # see SETUP.md. Only the client API (8008) is ever routed.
    deploy:
      resources:
        limits:
          memory: 1024M
    networks:
      - anarchy-pizza

  synapse-postgresql:
    image: postgres:18
    container_name: synapse-postgresql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Synapse requires C collation/UTF8 - only takes effect on first
      # initdb, so this must be right before the volume exists.
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - ${STORAGE_ROOT}/gold/synapse-postgresql:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - anarchy-pizza

networks:
  anarchy-pizza:
    name: anarchy-pizza
    external: true
