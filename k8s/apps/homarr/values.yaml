controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/homarr-labs/homarr
          tag: v1.76.0
        env:
          TZ: America/Denver
          BASE_URL: "https://homarr.anarchy.pizza"
          NEXTAUTH_URL: "https://homarr.anarchy.pizza"
          AUTH_PROVIDERS: oidc
          AUTH_OIDC_AUTO_LOGIN: "true"
          AUTH_OIDC_ISSUER: "https://auth.anarchy.pizza"
          AUTH_OIDC_CLIENT_ID: homarr
          AUTH_OIDC_CLIENT_NAME: Authelia
          AUTH_OIDC_SCOPE_OVERWRITE: "openid email profile groups"
          AUTH_OIDC_GROUPS_ATTRIBUTE: groups
          AUTH_OIDC_FORCE_USERINFO: "true"
          AUTH_LOGOUT_REDIRECT_URL: "https://auth.anarchy.pizza/logout"
        envFrom:
          - secretRef:
              name: homarr-secrets
          - secretRef:
              name: homarr-oidc-secrets
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 512Mi

service:
  main:
    controller: main
    ports:
      http:
        port: 7575

persistence:
  appdata:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 1Gi
    globalMounts:
      - path: /appdata

  # docker.sock widget deliberately dropped for this migration - no
  # clean k8s equivalent without an RBAC'd ServiceAccount + k8s-API
  # rework (see migration_plan.md). Revisit later if the widget is
  # actually missed.
