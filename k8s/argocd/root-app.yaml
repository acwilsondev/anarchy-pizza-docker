apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-docker
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:acwilsondev/homelab-docker.git
    targetRevision: main
    path: k8s/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
