controllers:
  main:
    pod:
      runtimeClassName: nvidia
    containers:
      main:
        image:
          repository: ghcr.io/open-webui/open-webui
          tag: ollama
        env:
          WEBUI_AUTH_TRUSTED_EMAIL_HEADER: Remote-Email
          WEBUI_AUTH_TRUSTED_NAME_HEADER: Remote-Name
          OLLAMA_HOST: 0.0.0.0:11434
          ENABLE_WEB_SEARCH: "true"
          WEB_SEARCH_ENGINE: searxng
          SEARXNG_QUERY_URL: "http://searxng.searxng.svc.cluster.local:8080/search?q=<query>"
        resources:
          limits:
            nvidia.com/gpu: 1
            memory: 8Gi
          requests:
            cpu: 100m
            memory: 512Mi

service:
  main:
    controller: main
    ports:
      http:
        port: 8080

persistence:
  ollama:
    # hostPath straight at the real bronze/ollama data, not a PVC -
    # k3s's local-path-provisioner puts PVCs on the OS disk
    # (/var/lib/rancher/k3s/storage, on /dev/mapper/ubuntu--vg-ubuntu--lv),
    # not the dedicated bulk-storage disk (/storage, /dev/sda) this
    # repo's gold/silver/bronze tiering actually lives on. Same pattern
    # as Calibre-web's book library - reuse large data in place rather
    # than duplicating ~55GB onto the wrong disk.
    type: hostPath
    hostPath: /storage/appdata/bronze/ollama
    globalMounts:
      - path: /root/.ollama
  data:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 3Gi
    globalMounts:
      - path: /app/backend/data
