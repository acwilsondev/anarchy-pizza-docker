services:
  calibre-web:
    image: lscr.io/linuxserver/calibre-web:latest
    container_name: calibre-web
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=America/Denver
      - DOCKER_MODS=linuxserver/mods:universal-calibre #optional
      - OAUTHLIB_RELAX_TOKEN_SCOPE=1 #optional
    volumes:
      - ${STORAGE_ROOT}/bronze/calibre-web:/config
      - ${MEDIA_ROOT}/books:/books
    ports:
      - 8083:8083
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.calibreweb.rule=Host(`library.${DOMAIN}`)
      - traefik.http.routers.calibreweb.entrypoints=web
      - traefik.http.routers.calibreweb.middlewares=authelia@docker
      - traefik.http.services.calibreweb.loadbalancer.server.port=8083
    networks:
      - anarchy-pizza

networks:
  anarchy-pizza:
    name: anarchy-pizza
    external: true